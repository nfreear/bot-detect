<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" href="data:;base64,=">

  <title>Form with bot detection</title>

  <h1>Form with bot detection</h1>

  <p>Custom elements to run bot-detection using <a href="https://www.cloudflare.com/products/turnstile/">Cloudflare Turnstile</a>, or similar.</p>


  <my-form-with-bot-detect
    sitekey="0x4AAAAAAFMBAZfvqVXocu-O"
    theme="light"
    appearance="interaction-only"
    retry-interval="12000"
    data-lang=""
    >
    <form method="post" action="/api/ts/siteverify">
      <p>
        <output id="top"></output>
      </p>

      <p>
        <label for="name">Your name</label>
        <my-input autocomplete="name" minlength="2" required>
          <input id="name" name="name">
        </my-input>
      </p>
      <p>
        <label for="email">Your email</label>
        <my-input type="email" autocomplete="email" minlength="8" required>
          <input id="email" name="email">
        </my-input>
      </p>
      <p>
        <my-input required>
          <input id="cb1" name="agree" type="checkbox">
          <label for="cb1">Do you agree to …?</label>
        </my-input>
      </p>

      <bot-detect id="bot-detect_1" novalidate></bot-detect>

      <p>
        <button type="submit">Submit</button>
      </p>
      <p>
        <output id="result"></output>
      </p>
    </form>
  </my-form-with-bot-detect>


  <footer>
    <p>Source: <a href="https://github.com/nfreear/bot-detect">@nfreear/bot-detect</a></p>
  </footer>


  <script type="importmap"> {
    "imports": {
      "my-form-validator": "https://esm.sh/gh/nfreear/form-validator"
    }
  } </script>

  <script type="module" src="../js/app.js?run"></script>
</html>
